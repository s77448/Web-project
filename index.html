<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Tracker Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <div class="header-content">
            <div class="logo">Manga<span>Tracker</span></div>
            <button id="theme-toggle" onclick="toggleTheme()" class="btn-theme">🌙 Dark mode</button>
        </div>
    </header>

    <main class="app-container">
        
        <section class="control-panel">
            <div class="card">
                <h2>Add Title / Dodaj tytuł 📚</h2>
                
                <input type="text" id="title" placeholder="Title / Tytuł">
                <input type="text" id="author" placeholder="Author / Autor">
                <input type="text" id="image_url" placeholder="Cover URL / Link do okładki">
                
                <select id="status">
                    <option value="Reading">Reading / Czytam 🟡</option>
                    <option value="Completed">Completed / Przeczytane 🟢</option>
                    <option value="Plan to Read">Plan to Read / W planach ⚪</option>
                </select>

                <select id="rating">
                    <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                    <option value="4">⭐⭐⭐⭐ (4/5)</option>
                    <option value="3">⭐⭐⭐ (3/5)</option>
                    <option value="2">⭐⭐ (2/5)</option>
                    <option value="1">⭐ (1/5)</option>
                </select>

                <button class="btn-add" onclick="addBook()">Save / Zapisz</button>
            </div>
        </section>

        <section class="library-panel">
            <div class="library-header">
                <h2>Collection / Kolekcja ✨</h2>
            </div>
            <div id="book-list" class="manga-grid">
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
