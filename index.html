<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Tracker Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <div class="header-content">
            <div class="logo">Manga<span>Tracker</span></div>
            <div class="header-controls">
                <button id="lang-toggle" onclick="toggleLang()" class="btn-theme">🇬🇧 EN</button>
                <button id="theme-toggle" onclick="toggleTheme()" class="btn-theme">☀️ Light mode</button>
            </div>
        </div>
    </header>

    <main class="app-container">
        
        <section class="control-panel">
            <div class="card">
                <h2 data-en="Add New Title" data-pl="Dodaj nowy tytuł">Add New Title</h2>
                
                <input type="text" id="title" data-en-placeholder="Title" data-pl-placeholder="Tytuł" placeholder="Title">
                <input type="text" id="author" data-en-placeholder="Author" data-pl-placeholder="Autor" placeholder="Author">
                <input type="text" id="image_url" data-en-placeholder="Cover URL" data-pl-placeholder="Link do okładki" placeholder="Cover URL">
                
                <div class="chapters-row">
                    <input type="number" id="chapter_current" min="0" data-en-placeholder="Current Ch." data-pl-placeholder="Rozdz. obecny" placeholder="Current Ch.">
                    <input type="number" id="chapter_total" min="0" data-en-placeholder="Total Ch." data-pl-placeholder="Rozdz. wszystkich" placeholder="Total Ch.">
                </div>

                <input type="text" id="read_url" data-en-placeholder="Read URL (Optional)" data-pl-placeholder="Link do czytania (Opcjonalnie)" placeholder="Read URL (Optional)">
                <textarea id="review" rows="3" data-en-placeholder="Your review (Optional)" data-pl-placeholder="Twoja opinia (Opcjonalnie)" placeholder="Your review (Optional)"></textarea>

                <select id="status">
                    <option value="Reading" data-en="Reading 🟡" data-pl="Czytam 🟡">Reading 🟡</option>
                    <option value="Completed" data-en="Completed 🟢" data-pl="Przeczytane 🟢">Completed 🟢</option>
                    <option value="Plan to Read" data-en="Plan to Read ⚪" data-pl="W planach ⚪">Plan to Read ⚪</option>
                </select>

                <select id="rating">
                    <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                    <option value="4">⭐⭐⭐⭐ (4/5)</option>
                    <option value="3">⭐⭐⭐ (3/5)</option>
                    <option value="2">⭐⭐ (2/5)</option>
                    <option value="1">⭐ (1/5)</option>
                </select>

                <button class="btn-add" onclick="addBook()" data-en="Save to Database" data-pl="Zapisz do bazy">Save to Database</button>
            </div>
        </section>

        <section class="library-panel">
            <div class="library-header">
                <h2 data-en="Your Collection" data-pl="Twoja kolekcja">Your Collection</h2>
                <div class="library-controls">
                    <div class="filter-group">
                        <button class="btn-filter active" onclick="setFilter('All')" data-en="All" data-pl="Wszystkie">All</button>
                        <button class="btn-filter" onclick="setFilter('Reading')" data-en="Reading" data-pl="Czytam">Reading</button>
                        <button class="btn-filter" onclick="setFilter('Completed')" data-en="Completed" data-pl="Przeczytane">Completed</button>
                        <button class="btn-filter" onclick="setFilter('Plan to Read')" data-en="Plan to Read" data-pl="W planach">Plan to Read</button>
                    </div>
                    <input type="text" id="search-input" oninput="applyFilters()" class="search-input" data-en-placeholder="🔍 Search title..." data-pl-placeholder="🔍 Szukaj tytułu..." placeholder="🔍 Search title...">
                </div>
            </div>
            <div id="book-list" class="manga-grid">
            </div>
        </section>

    </main>

    <div id="details-panel" class="details-panel"></div>

    <script src="script.js"></script>
</body>
</html>
