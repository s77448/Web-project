<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projekt - Lista Książek</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Dodaj książkę 📚</h1>
        <input type="text" id="title" placeholder="Tytuł książki">
        <input type="text" id="author" placeholder="Autor">
        
        <select id="status">
            <option value="Przeczytane">Przeczytane 🟢</option>
            <option value="Czytam">Czytam 🟡</option>
            <option value="W planach">W planach ⚪</option>
        </select>

        <button class="btn-add" onclick="addBook()">Zapisz do bazy</button>

        <h2>Twoja biblioteka:</h2>
        <ul id="book-list">
            </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
