<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projekt - Lista Książek</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4361ee;
            --primary-hover: #3a0ca3;
            --bg-gradient: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            --card-bg: #ffffff;
            --text-main: #2b2d42;
            --text-muted: #8d99ae;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0;
            padding: 20px; 
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: var(--text-main);
        }

        .container { 
            background: var(--card-bg); 
            width: 100%;
            max-width: 450px; 
            margin-top: 40px;
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 25px;
            color: var(--primary);
            text-align: center;
        }

        h2 {
            font-size: 18px;
            font-weight: 600;
            margin-top: 35px;
            margin-bottom: 15px;
            border-bottom: 2px solid #f1f2f6;
            padding-bottom: 10px;
        }

        input { 
            width: 100%; 
            padding: 14px 16px; 
            margin-bottom: 15px; 
            border: 2px solid #e2e8f0; 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.15);
        }

        button { 
            background-color: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            padding: 14px; 
            width: 100%; 
            font-size: 16px;
            font-weight: 600;
            cursor: pointer; 
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
        }

        button:hover { 
            background-color: var(--primary-hover); 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(58, 12, 163, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        ul { 
            list-style-type: none; 
            padding: 0; 
            margin: 0;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* Stylizacja paska przewijania (scrollbara) */
        ul::-webkit-scrollbar { width: 6px; }
        ul::-webkit-scrollbar-track { background: #f1f2f6; border-radius: 10px; }
        ul::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ul::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        li { 
            background: #f8fafc; 
            margin-bottom: 12px; 
            padding: 16px; 
            border-radius: 10px; 
            border-left: 4px solid var(--primary);
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: transform 0.2s;
        }

        li:hover {
            transform: translateX(5px);
            background: #f1f5f9;
        }

        .book-title {
            display: block;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .book-author {
            display: block;
            font-size: 14px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dodaj książkę 📚</h1>
        <input type="text" id="title" placeholder="Tytuł książki">
        <input type="text" id="author" placeholder="Autor">
        <button onclick="addBook()">Zapisz do bazy</button>

        <h2>Twoja biblioteka:</h2>
        <ul id="book-list">
            </ul>
    </div>

    <script>
        // Klucze Supabase
        const supabaseUrl = 'https://ppumihanfubvfwjkdbwg.supabase.co';
        const supabaseKey = 'sb_publishable_wqCAK1uB-dN4fsfEH1giAg_ST34VdJg';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // Pobieranie książek
        async function fetchBooks() {
            let { data: books, error } = await supabaseClient.from('books').select('*').order('id', { ascending: false });
            const list = document.getElementById('book-list');
            list.innerHTML = '';
            
            if (books && books.length > 0) {
                books.forEach(book => {
                    const li = document.createElement('li');
                    // Używamy ładnego formatowania HTML wewnątrz elementu listy
                    li.innerHTML = `
                        <span class="book-title">${book.title}</span>
                        <span class="book-author">✍️ ${book.author}</span>
                    `;
                    list.appendChild(li);
                });
            } else if (books && books.length === 0) {
                list.innerHTML = '<li style="border-left: 4px solid #cbd5e1; color: #8d99ae;">Brak książek w bazie. Dodaj pierwszą!</li>';
            } else if (error) {
                console.error("Błąd pobierania:", error);
            }
        }

        // Dodawanie książek
        async function addBook() {
            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value;
            
            if (!title || !author) {
                alert('Proszę wypełnić oba pola!');
                return;
            }

            // Zmieniamy tekst przycisku podczas ładowania
            const btn = document.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'Zapisywanie...';

            const { error } = await supabaseClient.from('books').insert([{ title: title, author: author }]);
            
            btn.innerText = originalText;

            if (error) {
                alert('Błąd dodawania. Sprawdź konsolę (F12).');
                console.error(error);
            } else {
                document.getElementById('title').value = '';
                document.getElementById('author').value = '';
                fetchBooks(); 
            }
        }

        // Start
        fetchBooks();
    </script>
</body>
</html>
